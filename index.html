<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>ElevateHub - React Prototype</title>
      <!-- Tailwind CDN (keeps prototype styling without full setup) -->
      <script src="https://cdn.tailwindcss.com"></script>
      <!-- FontAwesome -->
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
      <script>
        // Tailwind Configuration for brand colors and dark mode
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb', // Blue-600
                        secondary: '#4f46e5', // Indigo-600
                    }
                }
            }
        }

        // Check initial dark mode preference before page load to prevent flashing
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark')
        } else {
            document.documentElement.classList.remove('dark')
        }
      </script>
  </head>
  <body class="antialiased min-h-screen">
    <div class="mesh-gradient"></div>
    <div id="root"></div>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
